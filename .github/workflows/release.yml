name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x64
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install asio libsodium sqlcipher ftxui

      - name: Cache vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-windows-x64-windows-static-md-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            vcpkg-windows-x64-windows-static-md-

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = "${{ runner.temp }}\vcpkg-binary-cache"
          # Release-only: skip the debug build of every dependency (~2x faster cold builds)
          $env:VCPKG_BUILD_TYPE = "release"
          # Persist built packages in GitHub Packages so they survive across runs/branches
          $env:VCPKG_BINARY_SOURCES = "clear;nuget,GitHub,readwrite"
          $env:GITHUB_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $vcpkg = "${env:VCPKG_INSTALLATION_ROOT}/vcpkg.exe"
          & $vcpkg install asio libsodium sqlcipher ftxui --triplet x64-windows-static-md

      - name: Configure and build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: ./build/p2p --selftest

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/package_macos.sh build/p2p "dist/p2p-${{ matrix.name }}" "${GITHUB_REF_NAME#v}"
          cd dist && ditto -c -k --keepParent "p2p-${{ matrix.name }}/p2p.app" "p2p-${{ matrix.name }}.zip"

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build build --config Release

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: ./build/Release/p2p.exe --selftest

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Release/p2p.exe -DestinationPath "dist/p2p-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: p2p-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  formula:
    name: Update Homebrew formula
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point formula at the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TARBALL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL "$TARBALL" | sha256sum | cut -d' ' -f1)
          sed -i -E "s|url \"[^\"]+\"|url \"${TARBALL}\"|; s|sha256 \"[0-9a-f]+\"|sha256 \"${SHA}\"|" Formula/p2p.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/p2p.rb
          git diff --cached --quiet || {
            git commit -m "p2p ${TAG}"
            git push origin HEAD:main
          }

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
